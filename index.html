<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WJSPORT - LEMBAR PRODUKSI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="capture-area">
    <div class="main-container">
        <div class="header-section">
            <div class="payment-status">
                <div class="box-stempel">
                    <div class="top-label">DP</div>
                    <div class="space-stempel"></div>
                </div>
                <div class="box-stempel">
                    <div class="top-label">LUNAS</div>
                    <div class="space-stempel"></div>
                </div>
            </div>

            <div class="qr-container">
                <div id="qrcode"></div>
            </div>

            <div class="identity-group">
                <div class="identity-grid">
                    <div class="id-row"><span class="id-tag">NAMA</span><input type="text" id="nama" placeholder="..."></div>
                    <div class="id-row"><span class="id-tag">ORDERAN</span><input type="text" id="orderan" placeholder="..."></div>
                    <div class="id-row"><span class="id-tag">TGL MASUK</span><input type="date" id="tgl_masuk"></div>
                    <div class="id-row"><span class="id-tag">DEADLINE/DT</span><input type="date" id="deadline"></div>
                </div>
                <div class="identity-grid">
                    <div class="id-row"><span class="id-tag">NO LO.</span><input type="text" id="nolo" placeholder="..."></div>
                    <div class="id-row">
                        <span class="id-tag">MODEL</span>
                        <select id="model_global" onchange="updateDynamicMenu()">
                            <option value="">-- PILIH --</option>
                            <option value="KAOS">KAOS</option>
                            <option value="ROMPI">ROMPI</option>
                            <option value="JAKET">JAKET</option>
                            <option value="JAS ALMAMATER">JAS ALMAMATER</option>
                            <option value="TRAINING">TRAINING</option>
                            <option value="KEMEJA">KEMEJA</option>
                            <option value="WEARPACK">WEARPACK</option>
                            <option value="SETELAN BAJU">SETELAN BAJU</option>
                            <option value="SETELAN OR">SETELAN OR</option>
                            <option value="ATRIBUT">ATRIBUT</option>
                        </select>
                    </div>
                    <div class="id-row"><span class="id-tag">BAHAN</span><input type="text" id="bahan" placeholder="..."></div>
                    <div class="id-row"><span class="id-tag">KODE</span><input type="text" id="kode" placeholder="..."></div>
                </div>
            </div>
        </div>

        <div class="menu-grid" id="menu-area"></div>
    </div>
</div>

<div class="footer-tools">
    <button onclick="updateQR()" class="btn-tool">REFRESH QR</button>
    <button id="btnExport" class="btn-main">EXPORT PNG â²</button>
</div>

<script src="script.js"></script>
</body>
</html>
